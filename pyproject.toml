[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deploy-sha-verify"
version = "0.1.0"
description = "Did your deploy actually ship? Compare local git HEAD against the live deployment on Vercel, Cloudflare Pages, or Railway."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DevGwardo" }]
keywords = ["deploy", "vercel", "cloudflare", "railway", "ci", "git", "verify", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Software Distribution",
]

[project.scripts]
dsv = "deploy_sha_verify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <style>
      text { font-family: 'IBM Plex Mono', monospace; }
      .title { font-family: 'Syne', sans-serif; font-weight: 800; }
      .lbl  { fill: #c8f542; font-family: 'IBM Plex Mono', monospace; font-weight: 600; }
      .dim  { fill: #7a7f6b; font-family: 'IBM Plex Mono', monospace; }
      .cmd  { fill: #e8e6df; font-family: 'IBM Plex Mono', monospace; font-weight: 600; }
      .ok   { fill: #c8f542; font-family: 'IBM Plex Mono', monospace; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1280" height="320" fill="#0a0b09"/>

  <!-- grid -->
  <g stroke="#16180f" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
  </g>

  <text class="title" x="64" y="108" font-size="44" fill="#0a0b09" stroke="#c8f542" stroke-width="1.5">dsv check --url app.example.com</text>

  <text class="lbl" x="64" y="176" font-size="24">$ dsv check --url app.example.com</text>
  <text class="dim" x="64" y="212" font-size="22">local HEAD 4f76ae1 (master) - feat(home): ship the feed</text>
  <text class="ok"  x="64" y="248" font-size="22">verdict: deployed (high confidence)</text>
</svg>
